<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>רוטשילד 22 — התפריט שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/shared/style.css" />
</head>
<body>
<div id="landingView" class="landing-view" style="display:none">
  <div class="landing-overlay">
    <h1 class="landing-title">רוטשילד 22</h1>
    <div class="landing-sub" id="landingTableName"></div>
    <button class="primary landing-cta" id="landingEnterBtn">כניסה לתפריט 🍹</button>
  </div>
</div>

<header class="top">
  <div>
    <h1 id="tableTitle">טוען...</h1>
    <div class="sub" id="dinerTag"></div>
  </div>
  <button id="callWaiterBtn" style="display:none;background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.4)">🔔 קריאה למלצר</button>
</header>

<main>
  <div class="pill-nav">
    <button id="navMenu" class="active">📋 תפריט</button>
    <button id="navCart">🧾 עגלת השולחן <span id="cartCount"></span></button>
  </div>

  <div id="notice"></div>
  <div id="callStatus"></div>

  <section id="menuView"></section>
  <section id="cartView" style="display:none"></section>
</main>

<div class="fab-cart" id="fabCart" style="display:none">
  <button class="primary" id="fabCartBtn"></button>
</div>

<div id="nameModal" class="modal-backdrop" style="display:none">
  <div class="modal-sheet">
    <h2>ברוכים הבאים! 👋</h2>
    <p style="color:var(--muted);font-size:13px">איך לקרוא לך? זה יעזור לצוות ולשאר הסועדים לדעת מי הזמין מה.</p>
    <label class="field">השם שלי</label>
    <input type="text" id="nameInput" placeholder="לדוגמה: דנה" />
    <button class="primary" id="nameSubmit" style="width:100%">הצטרפות לשולחן</button>
  </div>
</div>

<div id="callModal" class="modal-backdrop" style="display:none">
  <div class="modal-sheet">
    <h2>🔔 קריאה למלצר</h2>
    <p style="color:var(--muted);font-size:13px">במה נוכל לעזור?</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
      <button class="ghost" data-call-reason="💧 מים בבקשה" style="text-align:right">💧 מים בבקשה</button>
      <button class="ghost" data-call-reason="🍴 סכו&quot;ם בבקשה" style="text-align:right">🍴 סכו"ם בבקשה</button>
      <button class="ghost" data-call-reason="🧾 חשבון בבקשה" style="text-align:right">🧾 חשבון בבקשה</button>
      <button class="ghost" data-call-reason="✋ צריך/ה עזרה" style="text-align:right">✋ צריך/ה עזרה</button>
    </div>
    <label class="field">או הודעה אחרת</label>
    <input type="text" id="callCustomInput" placeholder="לדוגמה: עוד פיתות בבקשה" />
    <button class="primary" id="callCustomBtn" style="width:100%">שליחת קריאה</button>
    <button class="ghost" id="callModalClose" style="width:100%;margin-top:8px">סגירה</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/labels.js"></script>
<script src="/diner/app.js"></script>
</body>
</html>
